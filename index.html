<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- iPhone / iPad ana ekran ayarları -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Phealx Portal"
  >

  <!-- Android / genel mobil -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!-- ANA EKRAN İKONU -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="./apple-touch-icon.png"
  >

  <!-- Tarayıcı favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./apple-touch-icon.png"
  >

  <title>Phealx Portal</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f4f8fa 100%
        );

      color: #082f4b;
    }

    .launcher {
      width: 100%;
      max-width: 420px;

      padding: 40px 24px;

      text-align: center;
    }

    .portal-icon {
      display: block;

      width: 128px;
      height: 128px;

      margin: 0 auto;

      object-fit: cover;

      border-radius: 28px;

      box-shadow:
        0 18px 45px
        rgba(8, 47, 75, 0.18);
    }

    h1 {
      margin:
        24px
        0
        8px;

      font-size: 26px;
      font-weight: 700;

      letter-spacing: -0.4px;

      color: #082f4b;
    }

    p {
      margin: 0;

      font-size: 15px;

      color: #6a7c89;
    }

    .spinner {
      width: 32px;
      height: 32px;

      margin:
        28px
        auto
        0;

      border:
        3px solid #e4edf1;

      border-top-color:
        #0797ad;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

  </style>

</head>


<body>

  <main class="launcher">

    <img
      class="portal-icon"
      src="./apple-touch-icon.png"
      alt="Phealx Portal"
    >

    <h1>
      Phealx Portal
    </h1>

    <p>
      Portal açılıyor...
    </p>

    <div
      class="spinner"
      aria-hidden="true"
    ></div>

  </main>


  <script>

    /*
    =====================================================
    PHEALX PORTAL ADRESİ
    =====================================================
    Aşağıdaki adresi kendi mevcut Apps Script
    /exec adresin ile değiştir.
    */

    const PORTAL_URL =
      "https://script.google.com/a/macros/phealx.com/s/AKfycbwIm9CCXXkFOFEdz-B59OtnP5NCHFtG81RoyRAFVxX-rLVp378fsZeSLVwSA-hvcoOM/exec";


    /*
    =====================================================
    PORTALA YÖNLENDİR
    =====================================================

    2 saniye bekletiyoruz.
    Böylece özellikle Safari'nin sayfa başlığını
    ve Apple Touch Icon'u okumasına zaman bırakıyoruz.
    */

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {

            window.location.replace(
              PORTAL_URL
            );

          },
          2000
        );

      }
    );

  </script>

</body>

</html>
