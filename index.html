<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- iOS Web App -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Phealx Portal"
  >

  <!-- Android / diğer mobil cihazlar -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >


  <!-- =========================================
       PHEALX PORTAL ANA EKRAN İKONU
       ========================================= -->

  <link
    rel="apple-touch-icon"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >


  <title>Phealx Portal</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f3f8fa 100%
        );

      color: #082f4b;

    }


    .launcher {

      width: 100%;
      max-width: 420px;

      padding: 40px 24px;

      text-align: center;

    }


    .portal-icon {

      display: block;

      width: 140px;
      height: 140px;

      margin: 0 auto;

      object-fit: cover;

      border-radius: 30px;

      box-shadow:
        0 20px 50px
        rgba(8, 47, 75, 0.20);

    }


    h1 {

      margin:
        26px
        0
        10px;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.5px;

      color: #082f4b;

    }


    p {

      margin: 0;

      font-size: 15px;

      line-height: 1.6;

      color: #657a89;

    }


    .status {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-top: 26px;

      padding:
        10px
        18px;

      border-radius: 100px;

      background:
        rgba(7, 151, 173, 0.08);

      color: #087f96;

      font-size: 13px;

      font-weight: 600;

    }


    .dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #0797ad;

    }


  </style>

</head>


<body>


  <main class="launcher">


    <img
      class="portal-icon"
      src="/phealx-portal-launcher/apple-touch-icon.png"
      alt="Phealx Portal"
    >


    <h1>
      Phealx Portal
    </h1>


    <p>
      Phealx uygulamalarına tek noktadan erişim.
    </p>


    <div class="status">

      <span class="dot"></span>

      Portal hazır

    </div>


  </main>


</body>

</html>
