<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Phealx Portal"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://raw.githubusercontent.com/ilhangozen/phealx-portal-assets/main/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="https://raw.githubusercontent.com/ilhangozen/phealx-portal-assets/main/icon-192.png"
  >

  <title>Phealx Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: grid;
      place-items: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f5f8fa 100%
        );

      color: #082f4b;
    }

    .launcher {
      text-align: center;
      padding: 32px;
    }

    .launcher img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 24px;

      box-shadow:
        0 16px 38px
        rgba(8, 47, 75, .16);
    }

    h1 {
      margin:
        22px
        0
        8px;

      font-size: 24px;
    }

    p {
      margin: 0;
      color: #5b7082;
      font-size: 14px;
    }

    .spinner {
      width: 30px;
      height: 30px;

      margin:
        24px
        auto
        0;

      border:
        3px solid #e6edf1;

      border-top-color: #0b87a8;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="launcher">

    <img
      src="https://raw.githubusercontent.com/ilhangozen/phealx-portal-assets/main/apple-touch-icon.png"
      alt="Phealx Portal"
    >

    <h1>Phealx Portal</h1>

    <p>Portal açılıyor...</p>

    <div class="spinner"></div>

  </div>


  <script>

    const PORTAL_URL =
      "https://script.google.com/a/macros/phealx.com/s/AKfycbwIm9CCXXkFOFEdz-B59OtnP5NCHFtG81RoyRAFVxX-rLVp378fsZeSLVwSA-hvcoOM/exec";


    setTimeout(() => {

      window.location.replace(PORTAL_URL);

    }, 800);

  </script>

</body>
</html>
