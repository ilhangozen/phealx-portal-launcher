<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <!-- iOS Web App -->
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Phealx Portal"
  >

  <!-- Android / diğer mobil cihazlar -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  >


  <!-- ==================================================
       PHEALX PORTAL ANA EKRAN İKONU
       BU KISMI DEĞİŞTİRME
       ================================================== -->

  <link
    rel="apple-touch-icon"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >


  <title>Phealx Portal</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

    }


    body {

      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f3f8fa 100%
        );

      color: #082f4b;

    }


    .launcher {

      width: 100%;
      max-width: 420px;

      padding: 40px 24px;

      text-align: center;

    }


    .portal-icon {

      display: block;

      width: 140px;
      height: 140px;

      margin: 0 auto;

      object-fit: cover;

      border-radius: 30px;

      box-shadow:
        0 20px 50px
        rgba(8, 47, 75, 0.20);

    }


    h1 {

      margin:
        26px
        0
        10px;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.5px;

      color: #082f4b;

    }


    p {

      margin: 0;

      font-size: 15px;

      line-height: 1.6;

      color: #657a89;

    }


    .loading {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

      margin-top: 28px;

      color: #087f96;

      font-size: 13px;

      font-weight: 600;

    }


    .spinner {

      width: 20px;
      height: 20px;

      border:
        2px solid
        rgba(7,151,173,.18);

      border-top-color:
        #0797ad;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    .manual-link {

      display: none;

      margin-top: 25px;

      color: #087f96;

      font-size: 13px;

      text-decoration: none;

      font-weight: 600;

    }


    .manual-link.show {

      display: inline-block;

    }


  </style>

</head>


<body>


  <main class="launcher">


    <img
      class="portal-icon"
      src="/phealx-portal-launcher/apple-touch-icon.png"
      alt="Phealx Portal"
    >


    <h1>
      Phealx Portal
    </h1>


    <p>
      Phealx uygulamalarına tek noktadan erişim.
    </p>


    <div class="loading">

      <div class="spinner"></div>

      <span>
        Portal açılıyor...
      </span>

    </div>


    <a
      id="manualLink"
      class="manual-link"
      href="#"
    >
      Portalı aç
    </a>


  </main>



  <script>

    /*
    =====================================================
    PHEALX PORTAL ADRESİ
    =====================================================

    BURAYA MEVCUT APPS SCRIPT /exec ADRESİNİ YAPIŞTIR.

    Örnek:

    https://script.google.com/a/macros/phealx.com/s/XXXXXXXX/exec

    =====================================================
    */


    const PORTAL_URL =
      "BURAYA_APPS_SCRIPT_EXEC_LINKINI_YAPISTIR";


    /*
    =====================================================
    MANUEL YEDEK LİNK
    =====================================================
    */

    const manualLink =
      document.getElementById(
        "manualLink"
      );


    manualLink.href =
      PORTAL_URL;



    /*
    =====================================================
    OTOMATİK YÖNLENDİRME
    =====================================================

    Launcher önce tamamen yükleniyor.

    Ardından 1,5 saniye sonra gerçek
    Phealx Portal'a geçiliyor.

    Ana ekran ikonu artık launcher URL'sine
    bağlı olduğu için ikon yapısını değiştirmiyoruz.
    =====================================================
    */


    window.addEventListener(
      "load",
      function () {


        setTimeout(
          function () {


            if (
              PORTAL_URL &&
              !PORTAL_URL.includes(
                "BURAYA_APPS_SCRIPT"
              )
            ) {


              window.location.replace(
                PORTAL_URL
              );


            } else {


              manualLink.classList.add(
                "show"
              );


            }


          },
          1500
        );


      }
    );



    /*
    =====================================================
    5 SANİYEDE PORTAL AÇILMAZSA
    MANUEL BUTONU GÖSTER
    =====================================================
    */


    setTimeout(
      function () {

        manualLink.classList.add(
          "show"
        );

      },
      5000
    );


  </script>


</body>

</html>
