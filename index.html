<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Phealx Portal"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <link
    rel="apple-touch-icon"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="/phealx-portal-launcher/apple-touch-icon.png"
  >

  <title>Phealx Portal</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #f3f8fa 100%
        );

      color: #082f4b;
    }

    .launcher {
      width: 100%;
      max-width: 430px;

      padding: 40px 24px;

      text-align: center;
    }

    .portal-icon {
      display: block;

      width: 140px;
      height: 140px;

      margin: 0 auto;

      object-fit: cover;

      border-radius: 30px;

      box-shadow:
        0 20px 50px
        rgba(8, 47, 75, 0.20);
    }

    h1 {
      margin:
        26px
        0
        10px;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.5px;

      color: #082f4b;
    }

    .description {
      margin: 0;

      font-size: 15px;

      line-height: 1.6;

      color: #657a89;
    }

    .install-box {
      margin-top: 28px;

      padding:
        18px
        20px;

      border-radius: 18px;

      background:
        rgba(7, 151, 173, 0.07);

      color: #315d70;

      font-size: 14px;

      line-height: 1.55;
    }

    .install-box strong {
      color: #087f96;
    }

    .loading {
      display: none;

      justify-content: center;
      align-items: center;

      gap: 10px;

      margin-top: 28px;

      color: #087f96;

      font-size: 13px;

      font-weight: 600;
    }

    .spinner {
      width: 20px;
      height: 20px;

      border:
        2px solid
        rgba(7,151,173,.18);

      border-top-color:
        #0797ad;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .standalone .install-box {
      display: none;
    }

    .standalone .loading {
      display: flex;
    }

  </style>

</head>


<body>

  <main
    id="launcher"
    class="launcher"
  >

    <img
      class="portal-icon"
      src="/phealx-portal-launcher/apple-touch-icon.png"
      alt="Phealx Portal"
    >

    <h1>
      Phealx Portal
    </h1>

    <p class="description">
      Phealx uygulamalarına tek noktadan erişim.
    </p>

    <div class="install-box">

      iPhone ana ekranına eklemek için:

      <br><br>

      Safari'de
      <strong>Paylaş</strong>
      →

      <strong>Ana Ekrana Ekle</strong>

    </div>

    <div class="loading">

      <div class="spinner"></div>

      <span>
        Portal açılıyor...
      </span>

    </div>

  </main>


  <script>

    /*
    =====================================================
    GERÇEK PHEALX PORTAL ADRESİ
    =====================================================
    */

    const PORTAL_URL =
      "https://script.google.com/a/macros/phealx.com/s/AKfycbwIm9CCXXkFOFEdz-B59OtnP5NCHFtG81RoyRAFVxX-rLVp378fsZeSLVwSA-hvcoOM/exec";


    /*
    =====================================================
    ANA EKRANDAN MI AÇILDI?
    =====================================================

    iPhone'da Home Screen'den açılan web uygulamasını
    standalone olarak algılamaya çalışıyoruz.
    */

    function isStandalone() {

      return (

        window.navigator.standalone === true ||

        window.matchMedia(
          "(display-mode: standalone)"
        ).matches

      );

    }


    /*
    =====================================================
    DAVRANIŞ
    =====================================================

    Safari'de normal açılırsa:
    - sayfada kalır
    - ikon görünür
    - kullanıcı Ana Ekrana Ekle yapabilir

    Ana ekran ikonundan açılırsa:
    - kısa açılış ekranı gösterilir
    - gerçek Apps Script portala geçilir
    */

    window.addEventListener(
      "load",
      function () {

        const launcher =
          document.getElementById(
            "launcher"
          );


        if (isStandalone()) {

          launcher.classList.add(
            "standalone"
          );


          setTimeout(
            function () {

              if (
                PORTAL_URL &&
                !PORTAL_URL.includes(
                  "BURAYA_APPS_SCRIPT"
                )
              ) {

                window.location.replace(
                  PORTAL_URL
                );

              }

            },
            900
          );

        }

      }
    );

  </script>

</body>

</html>
